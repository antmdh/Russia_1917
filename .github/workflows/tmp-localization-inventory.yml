name: temp apply localization
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-localization-inventory.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/menu-9-demo-langues
          fetch-depth: 0
      - name: Install translation engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate
      - name: Repair temporary script literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/tmp_apply_localization.py')
          lines=p.read_text(encoding='utf-8').splitlines()
          fixed=[]
          i=0
          repaired=False
          while i < len(lines):
              if 'raise RuntimeError("Séquence littérale' in lines[i] and i+1 < len(lines) and 'détectée dans un texte localisé")' in lines[i+1]:
                  indent=lines[i].split('raise RuntimeError',1)[0]
                  fixed.append(indent+'raise RuntimeError("Séquence littérale backslash+n détectée dans un texte localisé")')
                  i += 2
                  repaired=True
              else:
                  fixed.append(lines[i])
                  i += 1
          if not repaired:
              raise SystemExit('ligne temporaire à réparer introuvable')
          p.write_text('\n'.join(fixed)+'\n',encoding='utf-8')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
      - name: Apply five requested commits
        run: python .github/scripts/tmp_apply_localization.py
      - name: Push generated commits
        run: git push origin HEAD:experiment/menu-9-demo-langues
