name: temp apply localization
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-localization-inventory.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/menu-9-demo-langues
          fetch-depth: 0
      - name: Install translation engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install argostranslate
      - name: Repair temporary script literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/tmp_apply_localization.py')
          s=p.read_text(encoding='utf-8')
          broken='raise RuntimeError("Séquence littérale \\\n détectée dans un texte localisé")'
          fixed='raise RuntimeError("Séquence littérale \\\\n détectée dans un texte localisé")'
          if broken not in s:
              raise SystemExit('motif temporaire à réparer introuvable')
          p.write_text(s.replace(broken,fixed),encoding='utf-8')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY
      - name: Apply five requested commits
        run: python .github/scripts/tmp_apply_localization.py
      - name: Push generated commits
        run: git push origin HEAD:experiment/menu-9-demo-langues
